services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      # Bakes the commit into the image: GIT_REVISION=$(git rev-parse HEAD) docker compose up --build
      args:
        GIT_REVISION: ${GIT_REVISION:-}
    ports:
      - "8000:8000"
    volumes:
      - ck_auto_arima_chapkit_data:/workspace/data
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      WORKERS: 1
      # CHAPKIT_TEMP_DIR: /tmp  # Override temp directory for ML workspaces
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ck_auto_arima_chapkit

networks:
  ck_auto_arima_chapkit:
    driver: bridge

volumes:
  ck_auto_arima_chapkit_data: